<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista 3D — Validación de Contenidos RA</title>
    <meta name="description" content="Vista 3D para validar los 5 contenidos de realidad aumentada del libro sobre cambio climático">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="js/escena.js"></script>
    <script src="js/objetos.js"></script>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body style="overflow: hidden;">

    <!-- ===== SELECTOR DE CONTENIDO ===== -->
    <div id="selector-vista3d">
        <h2>🔍 Vista 3D</h2>
        <select id="select-contenido-3d">
            <option value="1">Pág 1 — Tierra + Gases</option>
            <option value="2">Pág 2 — Fábrica + Humo</option>
            <option value="3">Pág 3 — Iceberg</option>
            <option value="4">Pág 4 — Árbol</option>
            <option value="5">Pág 5 — Turbina Eólica</option>
        </select>
    </div>

    <!-- ===== ESCENA 3D ===== -->
    <a-scene embedded style="height: 100vh; width: 100vw; margin-top: 0;">

        <!-- ===== PÁGINA 1: Tierra con capa de gases ===== -->
        <a-entity id="contenido-1" visible="true">
            <a-sphere
                position="0 1.5 -3"
                radius="0.8"
                color="#2E86C1"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
            </a-sphere>
            <a-entity position="0 1.5 -3" capa-gases></a-entity>
        </a-entity>

        <!-- ===== PÁGINA 2: Fábrica con partículas de humo ===== -->
        <a-entity id="contenido-2" visible="false">
            <!-- Estructura de la fábrica -->
            <a-box position="0 0.5 -3" width="0.8" height="1" depth="0.6" color="#5D6D7E"></a-box>
            <a-box position="-0.2 0.3 -2.75" width="0.3" height="0.4" depth="0.02" color="#2C3E50" opacity="0.7"></a-box>
            <a-box position="0.2 0.3 -2.75" width="0.3" height="0.4" depth="0.02" color="#2C3E50" opacity="0.7"></a-box>
            <!-- Chimenea -->
            <a-cylinder position="0.3 1.2 -3" radius="0.08" height="0.6" color="#717D7E"></a-cylinder>
            <a-cylinder position="-0.2 1.1 -3" radius="0.06" height="0.4" color="#717D7E"></a-cylinder>
            <!-- Partículas de humo -->
            <a-entity position="0.3 1.5 -3" particulas-humo></a-entity>
        </a-entity>

        <!-- ===== PÁGINA 3: Iceberg derritiéndose ===== -->
        <a-entity id="contenido-3" visible="false">
            <!-- Iceberg parte superior -->
            <a-cone
                position="0 1 -3"
                radius-bottom="0.6"
                radius-top="0.15"
                height="1"
                color="#D6EAF8"
                animation="property: scale; from: 1 1 1; to: 0.8 0.7 0.8; dir: alternate; loop: true; dur: 5000; easing: easeInOutSine">
            </a-cone>
            <!-- Agua -->
            <a-plane
                position="0 0.4 -3"
                width="3"
                height="3"
                color="#2980B9"
                opacity="0.5"
                rotation="-90 0 0">
            </a-plane>
            <!-- Gotas de deshielo -->
            <a-entity position="0 0.8 -3" gotas-agua></a-entity>
        </a-entity>

        <!-- ===== PÁGINA 4: Árbol con ciclo de vida ===== -->
        <a-entity id="contenido-4" visible="false">
            <!-- Tronco -->
            <a-cylinder position="0 0.5 -3" radius="0.08" height="1" color="#6E2C00"></a-cylinder>
            <!-- Copa del árbol -->
            <a-sphere
                position="0 1.3 -3"
                radius="0.5"
                color="#27AE60"
                animation="property: color; from: #27AE60; to: #F39C12; dir: alternate; loop: true; dur: 4000; easing: easeInOutSine">
            </a-sphere>
            <!-- Hojas cayendo (pequeñas esferas) -->
            <a-sphere position="0.3 0.9 -2.8" radius="0.04" color="#E67E22"
                animation="property: position; to: 0.4 0.2 -2.8; dur: 3000; loop: true; easing: easeInQuad">
            </a-sphere>
            <a-sphere position="-0.2 0.8 -3.1" radius="0.03" color="#D35400"
                animation="property: position; to: -0.3 0.1 -3.1; dur: 3500; loop: true; delay: 500; easing: easeInQuad">
            </a-sphere>
            <!-- Suelo -->
            <a-circle position="0 0.01 -3" radius="0.8" color="#784212" rotation="-90 0 0"></a-circle>
        </a-entity>

        <!-- ===== PÁGINA 5: Turbina eólica ===== -->
        <a-entity id="contenido-5" visible="false">
            <a-entity position="0 0 -3" turbina-eolica></a-entity>
            <!-- Base -->
            <a-circle position="0 0.01 -3" radius="0.6" color="#2C3E50" rotation="-90 0 0"></a-circle>
        </a-entity>

        <!-- ===== ESCENARIO ===== -->
        <a-sky color="#0B1A2E"></a-sky>
        <a-light type="ambient" color="#556677" intensity="0.5"></a-light>
        <a-light type="directional" position="1 3 2" color="#FFFFFF" intensity="0.8"></a-light>
        <a-light type="point" position="0 2 -2" color="#2E86C1" intensity="0.3"></a-light>

        <!-- ===== CÁMARA ===== -->
        <a-entity camera position="0 1.6 0" look-controls wasd-controls></a-entity>
    </a-scene>

    <!-- ===== SCRIPT DE SELECTOR ===== -->
    <script>
        document.getElementById('select-contenido-3d').addEventListener('change', function () {
            var valor = parseInt(this.value);
            for (var i = 1; i <= 5; i++) {
                var el = document.getElementById('contenido-' + i);
                if (el) el.setAttribute('visible', i === valor);
            }
            console.log('🔍 Vista 3D — Mostrando contenido: Página ' + valor);
        });
    </script>
</body>
</html>
